# Her fonksiyonun JWT dogrulama modunu koda sabitler. Bu dosya olmadan bu
# ayar sadece deploy anindaki elle verilen --no-verify-jwt bayragina bagliydi
# — hicbir yerde kayitli degildi. Asagidaki degerler, tum fonksiyonlarin
# Authorization header'siz gercek davranisi test edilerek (2026-07-25)
# dogrulanan MEVCUT calisan durumu birebir yansitir; hicbiri degistirmiyor,
# sadece gelecekte yanlislikla bozulmasini onluyor.

# x-api-key / webhook-secret / telefon-tabanli kendi kimlik dogrulamasini
# yapan, gateway seviyesinde JWT gerektirmemesi gereken fonksiyonlar:
[functions.book-appointment]
verify_jwt = false

[functions.cancel-appointment]
verify_jwt = false

[functions.reschedule-appointment]
verify_jwt = false

[functions.public-book-appointment]
verify_jwt = false

[functions.public-booking-info]
verify_jwt = false

[functions.staff-whatsapp-webhook]
verify_jwt = false

[functions.send-appointment-notification]
verify_jwt = false

[functions.process-appointment-reminders]
verify_jwt = false

[functions.refresh-ad-tokens]
verify_jwt = false

[functions.sync-ad-insights]
verify_jwt = false

[functions.meta-oauth-bridge]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

# Gercek Supabase kullanici JWT'si (Authorization header) gerektiren
# fonksiyonlar — varsayilan zaten budur, tutarlilik icin acikca yazildi.
